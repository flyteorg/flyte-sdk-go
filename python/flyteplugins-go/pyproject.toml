[project]
name = "flyteplugins-go"
version = "0.0.1"
description = "Launch Go Flyte tasks from Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["flyte>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyteplugins_go"]

[tool.hatch.build.targets.wheel.force-include]
"src/flyteplugins_go/go.dockerignore" = "flyteplugins_go/go.dockerignore"

# Pinned so local runs and CI agree; matches flyteplugins-rs.
[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
